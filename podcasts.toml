# One [[podcast]] block per show. Transcripts are saved to transcripts/<slug>/.
#
# source = "published"  The show publishes its own transcripts, one URL per date.
#                       transcript_url must contain {date} (YYYY-MM-DD).
# source = "rss"        Audio is downloaded from the RSS feed and transcribed with
#                       Azure MAI-Transcribe. Needs AZURE_SPEECH_KEY and
#                       AZURE_SPEECH_ENDPOINT. Optional: host (labels the host's
#                       speaker turns by name), host_cues (phrases only the host
#                       says, used to recognise the host besides their name) and
#                       phrases (names and jargon the transcriber should favour).
#
# since = first episode date to include.

[[podcast]]
slug = "ai-daily-brief"
name = "The AI Daily Brief"
source = "published"
transcript_url = "https://aidailybrief.ai/e/{date}/transcript.md"
host = "Nathaniel Whittemore"
ad_start_cues = ["brought to you by"]
ad_sponsors = ["KPMG", "Blitzy", "Hyperagent", "Harbor", "OutSystems", "Retool", "Zencoder", "Robots and Pencils",
               "Mission Cloud", "Rackspace", "Granola"]
since = 2026-06-01

[[podcast]]
slug = "how-i-ai"
name = "How I AI"
source = "rss"
feed = "https://anchor.fm/s/1035b1568/podcast/rss"
since = 2026-09-01
host = "Claire Vo"
host_cues = ["welcome to How I AI", "welcome back to How I AI", "thanks for joining How I AI", "How I AI listeners",
             "thanks so much for watching", "this episode is brought to you by"]
ad_start_cues = ["this episode is brought to you by", "Optimizely agent platform",
                 "As AI adoption grows, so do your company's security risks"]
ad_end_cues = ["See the rankings at Open Art Arena"]
ad_tail_cues = ["Start building today"]
ad_sponsors = ["Work OS", "WorkOS", "HyperAgent", "DX", "Vanta", "OpenArt", "Open Art Arena", "Optimizely"]
phrases = [
    "Claire Vo", "How I AI", "ChatPRD", "Lenny's Podcast",
    "Claude", "Claude Code", "Anthropic", "OpenAI", "ChatGPT", "Codex",
    "Cursor", "Gemini", "Grok", "MCP", "Jev", "vibe coding",
]

[[podcast]]
slug = "latent-space"
name = "Latent Space"
source = "substack"
