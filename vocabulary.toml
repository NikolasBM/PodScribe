# Shared vocabulary for episode metadata (categories, formats, levels, technologies).
#
# Compiled from a read-through of all 102 transcripts (2026-06-01 to 2026-10-01). Transcripts are machine
# transcribed, so aliases list the spellings and mis-hearings that actually occur ("Soul" for Sol,
# "Groq" for Grok, "Open Claw" ...). Matching is case-insensitive on word boundaries; an alias is plain text.
#
# [[term]]
#   name     canonical name written to the metadata
#   kind     model | product | company | concept | benchmark | event
#   aliases  other spellings. Keep ambiguous words out ("Sol", "Dots", "Muse", "Kai" alone are common words):
#            list them with their context instead ("GPT-6 Sol", "OpenAI Dots", "Meta Muse").
#   exact_case  true if the name is also an everyday word ("Meta", "Cursor", "Warp"): match it capitalised only
#   note     reminder for whoever maintains the list
#
# Product, model and company are separate terms on purpose: "Claude Code" (product) is not "Claude Opus 5.5"
# (model) and neither is "Anthropic" (company).

# --- Categories -------------------------------------------------------------
# An episode gets at most four, and only for topics it discusses at length (not a passing mention).
# `question` is what Jev is asked per category, so write it as a yes/no question about the episode.

[categories.agents]
question = "Does the episode discuss autonomous or persistent AI agents (personal agents, team agents, agent platforms, loops, harnesses) at length?"
[categories.coding]
question = "Does the episode discuss AI tools or practices for building software (coding agents, vibe coding, AI coding benchmarks) at length?"
[categories.models]
question = "Does the episode discuss specific AI model releases, benchmarks or capability comparisons at length?"
[categories.model-strategy]
question = "Does the episode discuss token pricing, cost per task, usage caps, model routing or choosing between models at length?"
[categories.open-weights]
question = "Does the episode discuss open-weight or Chinese models, local AI, distillation or model sovereignty at length?"
[categories.enterprise]
question = "Does the episode discuss how companies adopt, buy, govern or measure AI (budgets, ROI, procurement, deployments) at length?"
[categories.work]
question = "Does the episode discuss AI's effect on jobs, skills, training, productivity or how organisations and roles change at length?"
[categories.safety-security]
question = "Does the episode discuss AI safety, alignment, guardrails, rogue-agent incidents, cyber capabilities or catastrophic risk at length?"
[categories.policy]
question = "Does the episode discuss government action on AI (regulation, executive orders, export controls, geopolitics, lawsuits, public opinion) at length?"
[categories.infrastructure]
question = "Does the episode discuss chips, compute, data centers, energy, memory supply or capex at length?"
[categories.funding-markets]
question = "Does the episode discuss funding rounds, valuations, IPOs, earnings, acquisitions or market moves at length?"
[categories.consumer]
question = "Does the episode discuss consumer AI products (personal assistants, devices, voice, shopping agents) at length?"
[categories.design]
question = "Does the episode discuss AI for design and creative media (UI design, image, video, 3D, audio) at length?"
[categories.marketing]
question = "Does the episode discuss AI for marketing, content or sales work at length?"

# --- Formats (exactly one per episode) ---------------------------------------

[formats]
news-roundup = "Headlines only, no main topic."
news-analysis = "Headlines followed by one main topic analysed in depth. The default shape of The AI Daily Brief."
commentary = "The host alone reads and comments on essays, reports or posts by others, or explains a topic (essay, primer, retrospective, long-read)."
review = "Evaluation of a model or product, including aggregated reactions to a launch."
tutorial = "How-to: techniques, frameworks or a webinar teaching a method."
demo = "The host or a guest walks through using a tool or workflow on screen."
interview = "A conversation with a named guest or co-host as the main content."

# --- Levels (one per episode) -------------------------------------------------

[levels]
0 = "General audience, no technical background needed."
1 = "Informed business or tech audience; technical words but no hands-on steps."
2 = "Semi-technical: benchmarks, architectures, API or product detail."
3 = "Hands-on: step-by-step building, code, evals or configuration."

